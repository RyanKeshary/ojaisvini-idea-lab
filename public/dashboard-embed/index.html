<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ojasvini Seller Dashboard</title>
<style>
:root{--bg:#fff;--card:#EBEBEB;--cb:transparent;--bd:#C0C0C0;--tx:#13233b;--mu:#5a6577;--p:#004E98;--s:#3A6EA5;--c:#FF6700;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 8px}h3{font-size:14px;margin:0}h4{font-size:12px;margin:0;color:var(--mu);font-weight:600}h5{font-size:10px;margin:0;color:var(--mu);font-weight:500}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh;transition:grid-template-columns .2s}.app.col{grid-template-columns:60px 1fr}
aside{border-right:1px solid var(--bd);padding:12px 8px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto;background:var(--bg);z-index:30}
.prof{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;cursor:pointer;border:0;background:none;color:inherit;text-align:left;width:100%;position:relative}.prof:hover,.nl:hover{background:var(--card)}
.av{width:32px;height:32px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.nl{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--tx);text-decoration:none;font-size:14px;border:0;background:none;width:100%;cursor:pointer;font-family:inherit}
.nl i{font-style:normal;width:20px;text-align:center;flex:none}.nl.on{background:var(--p);color:#fff}
.bd{margin-left:auto;background:var(--c);color:#fff;border-radius:99px;font-size:10px;padding:0 6px;font-weight:700}
.col .nl span,.col .prof>div:not(.av),.col summary span,.col .pop,.col .sub{display:none}.col .bd{position:absolute;margin:-18px 0 0 14px}
hr{border:0;border-top:1px solid var(--bd);margin:8px 0;width:100%}
details summary{list-style:none;cursor:pointer}details .sub{padding-left:10px}
.push{margin-top:auto}.pop{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:10px;font-size:12px;margin:8px 0}
main{min-width:0;display:flex;flex-direction:column;flex:1}
.top{display:flex;align-items:center;gap:8px;padding:14px 24px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:20}
.top h1{flex:1}.pg{padding:24px 32px;max-width:none;width:100%;animation:pageEnter 0.28s cubic-bezier(0.16,1,0.3,1) both}
@keyframes pageEnter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-bottom:20px}.span2{grid-column:span 2}
.card{background:var(--card);border:1px solid var(--cb);border-radius:14px;padding:20px}
.big{font-size:20px;font-weight:700}.mu{color:var(--mu)}.sm{font-size:12px}
.btn{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;transition:transform .1s,background .15s;text-decoration:none;display:inline-block}
.btn:hover{background:var(--card)}.btn:active{transform:scale(.97)}.btn.pri{background:#004E98;color:#fff;border-color:#004E98}.btn.pri:hover{background:#3A6EA5}.btn.cta{background:#FF6700;color:#fff;border-color:#FF6700}.btn.cta:hover{filter:brightness(1.08)}.btn.sm{padding:4px 8px;font-size:12px}.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.sp{justify-content:space-between}
input,select,textarea{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);width:100%}input[type=radio],input[type=checkbox]{width:auto}input[type=range]{padding:0}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 4px}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);font-size:12px}
.tag{font-size:10px;padding:1px 8px;border-radius:99px;border:1px solid var(--bd);white-space:nowrap}.tag.o{background:var(--c);border-color:var(--c);color:#fff}.tag.b{background:var(--s);border-color:var(--s);color:#fff}
.chip{border:1px solid var(--bd);border-radius:99px;padding:4px 10px;background:var(--bg);color:var(--tx);cursor:pointer;font:inherit;font-size:12px}.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden}.bar>div{height:100%;background:var(--p)}
.orb{width:84px;height:84px;border-radius:50%;border:0;background:#FF6700;color:#fff;font-size:32px;cursor:pointer;box-shadow:0 0 0 0 #ff670066}.orb.rec{animation:pl 1.2s infinite}@keyframes pl{to{box-shadow:0 0 0 22px #ff670000}}
.sk{background:linear-gradient(90deg,var(--card),var(--bd),var(--card));background-size:200% 100%;animation:sh 1s infinite;border-radius:10px;height:90px;margin-bottom:16px}@keyframes sh{to{background-position:-200% 0}}
.priv .money{filter:blur(6px)}
#toasts{position:fixed;bottom:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:100;max-width:calc(100vw - 32px)}
.toast{background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:12px;animation:in .2s;display:flex;gap:10px;align-items:center}.toast.err{background:#b3261e;color:#fff}.toast button{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;font:inherit}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.ov{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:60;padding:16px}
.md{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto}
.lock{position:fixed;inset:0;background:var(--bg);z-index:90;display:grid;place-items:center;text-align:center}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center;margin-top:12px}.keys button{height:60px;font-size:20px}
.tip{position:fixed;z-index:80;background:var(--tx);color:var(--bg);padding:12px;border-radius:10px;max-width:260px;font-size:12px}.ring{outline:3px solid #FF6700;outline-offset:3px;border-radius:10px}
.pr{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.pr img,.em{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--bg);display:grid;place-items:center;font-size:22px;flex:none}
.menu{display:none}
@media(max-width:800px){
  .app,.app.col{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;bottom:0;width:280px;transform:translateX(-100%);transition:transform .25s ease-out;box-shadow:0 0 40px rgba(0,0,0,0.3);z-index:100}
  .app.open aside{transform:none}
  .menu{display:inline-flex}
  .grid{grid-template-columns:1fr;gap:12px}
  .span2{grid-column:auto}
  .pg{padding:14px;width:100%}
  .top{padding:10px 14px}
  .app.col .nl span,.app.col .prof>div:not(.av){display:block}
  .hide-m{display:none}
  .card{padding:14px;border-radius:12px}
  .top h1{font-size:16px}
  .btn{padding:7px 10px;font-size:13px}
  .row{gap:6px}
  table{display:block;overflow-x:auto}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="app" id="app">
<aside id="nav"></aside>
<main><div class="top"><button class="btn menu" data-a="menu" aria-label="Menu">☰</button><button class="btn hide-m" data-a="col" aria-label="Collapse sidebar">⇔</button><h1 id="ttl"></h1>
<button class="btn" data-a="listen" id="lbtn">🔊 <span id="lt"></span></button><button class="btn cta" data-a="newl" id="newbtn">+ <span id="nt"></span></button></div>
<div class="pg" id="pg"></div></main></div>
<div id="toasts" aria-live="polite"></div><div id="ovl"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={g(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const D0={name:'Sunita Tai',slug:'sunita-swad',lang:'en',theme:'',priv:0,pin:'',tour:0,col:0,upi:'',bal:194,pays:[],done:[],
products:[{id:1,name:'Mango pickle',cat:'Food',price:150,e:'🥭',sync:1},{id:2,name:'Papad (1 kg)',cat:'Food',price:110,e:'🫓',sync:1},{id:3,name:'Cane basket',cat:'Crafts',price:220,e:'🧺',sync:1}],
orders:[{id:1001,item:'Mango pickle',qty:2,amt:300,pc:'412205',v:'Bhor',st:'new',pay:'UPI'},{id:1002,item:'Papad (1 kg)',qty:1,amt:110,pc:'412205',v:'Bhor',st:'new',pay:'COD'},{id:1003,item:'Cane basket',qty:1,amt:220,pc:'411030',v:'Pune',st:'done',pay:'UPI'}],
sales:[180,260,220,400,310,520,330],
posts:[{id:1,by:'Radha Devi',tx:'How do I pack pickle jars so they do not leak in transit?',lk:4,r:[{by:'Meena (Sakhi mentor)',tx:'Use a thin plastic sheet under the lid and wrap each jar in newspaper.'}],me:0},{id:2,by:'Bhavna Ben',tx:'My first order came today from Surat. Keep going, sisters!',lk:11,r:[],me:0}]};
let S=Object.assign({},D0,LS.g('oj',{}));const save=()=>LS.s('oj',S);
const T={en:{home:'Home',profile:'Profile',assistant:'Sakhi AI',create:'Create',products:'Products',orders:'Orders',payouts:'Payouts',schemes:'Schemes',learn:'Learn',community:'Community',insights:'Insights',settings:'Settings',help:'Help',grow:'Grow',listen:'Listen',hi:'Namaste',nw:'New listing'},
hi:{home:'होम',profile:'प्रोफ़ाइल',assistant:'सखी AI',create:'बनाएं',products:'उत्पाद',orders:'ऑर्डर',payouts:'भुगतान',schemes:'योजनाएं',learn:'सीखें',community:'समुदाय',insights:'जानकारी',settings:'सेटिंग्स',help:'मदद',grow:'आगे बढ़ें',listen:'सुनें',hi:'नमस्ते',nw:'नया लिस्टिंग'},
mr:{home:'होम',profile:'प्रोफाइल',assistant:'सखी AI',create:'तयार करा',products:'उत्पादने',orders:'ऑर्डर',payouts:'पेमेंट',schemes:'योजना',learn:'शिका',community:'समुदाय',insights:'माहिती',settings:'सेटिंग्ज',help:'मदत',grow:'प्रगती',listen:'ऐका',hi:'नमस्कार',nw:'नवीन यादी'}};
const t=k=>(T[S.lang]||T.en)[k]||T.en[k]||k,VL={en:'en-IN',hi:'hi-IN',mr:'mr-IN'};
const m=n=>`<span class="money">₹${Math.round(n)}</span>`,nNew=()=>S.orders.filter(o=>o.st=='new').length;
function say(x){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(x);u.lang=VL[S.lang];speechSynthesis.speak(u)}catch(e){toast('Audio not supported on this device','err')}}
function toast(x,ty,act,fn){const e=document.createElement('div');e.className='toast '+(ty||'');e.textContent=x;if(act){const b=document.createElement('button');b.textContent=act;b.onclick=()=>{fn();e.remove()};e.append(b)}$('#toasts').append(e);setTimeout(()=>e.remove(),act?5000:3200)}
function modal(h){$('#ovl').innerHTML=`<div class="ov" data-a="mclose"><div class="md" role="dialog" aria-modal="true">${h}</div></div>`}const mx=()=>$('#ovl').innerHTML='';
function listen(cb){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Mic not supported here. Use a sample or type.','err');const r=new R();r.lang=VL[S.lang];r.onresult=e=>cb(e.results[0][0].transcript);r.onerror=()=>toast('Could not hear you. Try again.','err');r.start();toast('Listening…')}
/* ---------- nav ---------- */
const NAV=[['home','⌂'],['assistant','💬'],['create','✚'],['products','▦'],['orders','☰'],['payouts','₹']],GR=[['schemes','✦'],['learn','▤'],['community','☺'],['insights','◔']];
let R='home';
const lk=([k,i])=>`<a href="#${k}" class="nl ${R==k?'on':''}" title="${t(k)}" ${k=='create'?'id="nav-create"':''}><i>${i}</i><span>${t(k)}</span>${k=='orders'&&nNew()?`<b class="bd">${nNew()}</b>`:''}</a>`;
function nav(){$('#nav').innerHTML=`<button class="prof" id="prof" data-a="prof" aria-label="Profile menu"><div class="av">${esc(S.name[0])}</div><div><h3>${esc(S.name)}</h3><h5>/shop/${S.slug}</h5></div></button><div id="pm"></div><hr>
${NAV.map(lk).join('')}<hr><details ${GR.some(g=>g[0]==R)?'open':''} id="grow"><summary class="nl"><i>⊞</i><span>${t('grow')}</span></summary><div class="sub">${GR.map(lk).join('')}</div></details>
<div class="push"></div>${nNew()?`<div class="pop"><b>${nNew()} orders waiting</b><br><a href="#orders">Review now</a></div>`:''}<hr>${lk(['profile','👤'])}${lk(['settings','⚙'])}${lk(['help','?'])}`;
$('#lt').textContent=t('listen');$('#nt').textContent=t('nw');$('#ttl').textContent=t(R);document.title=t(R)+' · Ojasvini';$('#app').classList.toggle('col',!!S.col);document.body.classList.toggle('priv',!!S.priv)}
/* ---------- chart ---------- */
const LB=['6d','5d','4d','3d','2d','1d','Today','+1d','+2d','+3d'];
function fcast(v){const l=v.slice(-3),a=l.reduce((x,y)=>x+y)/3,sl=(l[2]-l[0])/2;return[1,2,3].map(i=>Math.max(0,Math.round(a+sl*i)))}
function chart(v){const f=fcast(v),all=[...v,...f],mxv=Math.max(...all,1);return`<svg viewBox="0 0 ${all.length*56} 172" width="100%" role="img" aria-label="Sales for the last 7 days and a 3-day forecast">`+all.map((x,i)=>{const h=x/mxv*130,fc=i>=v.length;return`<g><rect x="${i*56+10}" y="${150-h}" width="36" height="${h}" rx="4" fill="${fc?'none':'var(--p)'}" stroke="${fc?'#FF6700':'none'}" stroke-width="2" stroke-dasharray="${fc?'4 3':'0'}"><title>₹${x}${fc?' (forecast)':''}</title></rect><text x="${i*56+28}" y="166" text-anchor="middle" font-size="10" fill="var(--mu)">${LB[i]}</text></g>`}).join('')+'</svg>'}
/* ---------- pages ---------- */
const net=a=>Math.round(a*.88),pend=()=>S.products.filter(p=>!p.sync).length;
const P={};
P.home=()=>{const o=S.orders.filter(x=>x.st=='new'),f=fcast(S.sales),tr=f[2]>=S.sales[6]?'rising':'easing';return`<h4>${t('hi')}, ${esc(S.name)}</h4><div class="grid" style="margin-top:8px">
<div class="card" id="k1"><h4>Available to withdraw</h4><div class="big">${m(S.bal)}</div><h5>After 12% fees</h5><div class="row" style="margin-top:12px"><a class="btn pri" href="#payouts">Withdraw</a></div></div>
<div class="card"><h4>New orders</h4><div class="big">${o.length}</div><h5>${o.length?m(o.reduce((a,b)=>a+b.amt,0))+' waiting for you':'All caught up'}</h5><div class="row" style="margin-top:12px"><a class="btn pri" href="#orders">${o.length?'Accept orders':'View orders'}</a></div></div>
<div class="card"><h3>Add a product in 2 minutes</h3><h5>Speak, snap, sell. No typing needed.</h5><div class="row" style="margin-top:12px"><a class="btn cta" href="#create">Start listing</a><button class="btn" data-a="store">Preview my shop</button></div></div>
<div class="card"><h3>What to do next</h3><p class="sm mu" style="margin:6px 0 10px">${o.length?`Accept your ${o.length} new order${o.length>1?'s':''} first.`:'Share your shop link on WhatsApp to get more orders.'} Sales look ${tr} for the next 3 days.</p><a href="#schemes">Find schemes for you</a></div></div>
<div class="card" style="margin-bottom:16px"><div class="row sp"><h2>Sales: last 7 days and forecast</h2><h5>Dashed = estimate</h5></div>${chart(S.sales)}<h5>Expected next 3 days: ${f.map(x=>'₹'+x).join(', ')}</h5></div>
<div class="card"><h2>Recent orders</h2>${S.orders.slice(-4).reverse().map(x=>`<div class="row sp" style="padding:6px 0"><span>${esc(x.item)} × ${x.qty}</span><span class="tag ${x.st=='new'?'o':''}">${x.st}</span></div>`).join('')||'<p class="mu">No orders yet.</p>'}</div>`};

P.assistant=()=>{
  return `<div class="card" style="margin-bottom:16px">
    <div class="row sp">
      <h2>🤖 Sakhi Didi AI Assistant</h2>
      <span class="tag o">Always Live</span>
    </div>
    <p class="sm mu" style="margin:4px 0 12px">Ask any business question in your language — pricing, photos, loans, or schemes.</p>
    <div id="ai-chat" style="display:flex;flex-direction:column;gap:10px;max-height:360px;overflow-y:auto;padding:8px 0;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)">
      <div style="background:var(--card);padding:10px 14px;border-radius:12px;max-width:85%;align-self:flex-start">
        <b>Sakhi Didi:</b> Namaste! I am your AI business guide. How can I help your shop today?
      </div>
    </div>
    <div class="row" style="margin-top:12px">
      <input id="ai-in" placeholder="Ask Sakhi Didi..." style="flex:1" onkeydown="if(event.key==='Enter')A.aiSend()">
      <button class="btn" data-a="aiMic">🎤</button>
      <button class="btn pri" data-a="aiSend">Send</button>
    </div>
    <div class="row" style="margin-top:10px;gap:6px">
      <button class="chip" data-a="aiQuick" data-v="How do I increase sales?">💡 More sales</button>
      <button class="chip" data-a="aiQuick" data-v="What schemes am I eligible for?">🏛️ Schemes</button>
      <button class="chip" data-a="aiQuick" data-v="How should I price my goods?">🏷️ Pricing</button>
    </div>
  </div>`;
};

/* create */
let C={t:'',img:'',d:null,busy:0,ok:0};const SAMP=['I make mango pickle','मी आंब्याचं लोणचं बनवते','I weave cane baskets','I stitch blouses'];
const KW=[[/pickle|लोणच|अचार|achar/i,'Food',120,160,'🥭'],[/papad|पापड/i,'Food',90,120,'🫓'],[/basket|टोकरी|cane/i,'Crafts',180,300,'🧺'],[/saree|साडी|handloom/i,'Crafts',600,1200,'🧵'],[/blouse|stitch|शिल|सिल|tailor/i,'Tailoring',200,400,'🪡'],[/milk|ghee|paneer|दूध|तूप|dairy/i,'Dairy',60,90,'🥛']];
function draft(){const x=C.t,k=KW.find(r=>r[0].test(x))||[0,'Other',100,200,'📦'],w=x.replace(/^(i make|i weave|i stitch|i sell)\s*/i,'').split(/\s+/).slice(0,4).join(' ')||'My product';
C.d={name:w[0].toUpperCase()+w.slice(1),cat:k[1],lo:k[2],hi:k[3],e:k[4],price:Math.round((k[2]+k[3])/2/5)*5}}
P.create=()=>{const d=C.d;return`<div class="card" style="margin-bottom:16px"><h2>1. Say what you make</h2><div class="row"><button class="orb" data-a="mic" aria-label="Speak">🎤</button><div style="flex:1;min-width:200px"><div class="row">${SAMP.map((s,i)=>`<button class="chip" data-a="samp" data-v="${i}">${s}</button>`).join('')}</div><label for="ct">Or type it</label><input id="ct" value="${esc(C.t)}" placeholder="e.g. I make mango pickle" data-i="ctxt"></div></div></div>
<div class="card" style="margin-bottom:16px;${C.t?'':'opacity:.5'}"><h2>2. Snap a photo</h2><input type="file" accept="image/*" capture="environment" id="ph" ${C.t?'':'disabled'}>${C.img?`<img src="${C.img}" alt="Product photo" style="max-width:160px;border-radius:10px;margin-top:8px">`:''}<div class="row" style="margin-top:8px"><button class="btn" data-a="mk" ${C.t&&!C.busy?'':'disabled'}>${C.img?'Make my listing':'Skip photo and make listing'}</button></div></div>

  box.appendChild(botBubble);
  box.scrollTop = box.scrollHeight;

  try {
    const res = await fetch('/api/assistant', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ message: txt, locale: S.lang || 'en' })
    });
    if(!res.ok) throw new Error('API error');
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let accumulated = '';
    let buffer = '';
    botBubble.innerHTML = '<b>Sakhi Didi:</b> ';
    while(true) {
      const { value, done } = await reader.read();
      if(done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split('\n\n');
      buffer = parts.pop() || '';
      for(const part of parts) {
        for(const line of part.split('\n')) {
          const trimmed = line.trim();
          if(trimmed.startsWith('data: ')) {
            const raw = trimmed.slice(6).trim();
            if(raw === '[DONE]') continue;
            try {
              const data = JSON.parse(raw);
              if(data.token) {
                accumulated += data.token;
                botBubble.innerHTML = '<b>Sakhi Didi:</b> ' + esc(accumulated).replace(/\n/g, '<br>');
                box.scrollTop = box.scrollHeight;
              }
            } catch(e) {}
          }
        }
      }
    }
    if(!accumulated) botBubble.innerHTML = '<b>Sakhi Didi:</b> I am here to help you grow your shop!';
  } catch(e) {
    botBubble.innerHTML = '<b>Sakhi Didi:</b> I am here to guide you with your shop, schemes, and orders!';
  }
},

// Sync backend products, orders, payouts
async function syncBackend() {
  try {
    const [pRes, oRes, payRes] = await Promise.all([
      fetch('/api/products').then(r=>r.ok?r.json():null),
      fetch('/api/orders').then(r=>r.ok?r.json():null),
      fetch('/api/payouts').then(r=>r.ok?r.json():null)
    ]);
    if(pRes && pRes.ok && pRes.products && pRes.products.length > 0) {
      S.products = pRes.products.map(p => ({
        id: p.id,
        name: p.title,
        cat: 'General',
        price: p.priceINR,
        e: '📦',
        sync: 1,
        img: p.images && p.images[0] ? p.images[0] : ''
      }));
    }
    if(oRes && oRes.ok && oRes.orders && oRes.orders.length > 0) {
      S.orders = oRes.orders.map(o => ({
        id: o.id.slice(-4),
        item: o.buyerName ? 'Order from ' + o.buyerName : 'Order',
        qty: 1,
        amt: o.total,
        pc: '412205',
        v: 'Village',
        st: o.status === 'READY' || o.status === 'DELIVERED' ? 'done' : 'new',
        pay: o.payStatus === 'PAID' ? 'UPI' : 'COD'
      }));
    }
    if(payRes && payRes.ok) {
      if(payRes.settledTotal !== undefined) S.bal = payRes.pendingTotal || 194;
    }
    save();
    nav();
    render();
  } catch(e) {
    console.warn('[Dashboard] Local mode fallback:', e);
  }
}
syncBackend();

go();if(S.pin)lock();if(!S.tour)setTimeout(()=>tour(0),700);
